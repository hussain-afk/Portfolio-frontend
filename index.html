<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- =====================================================
         BEFORE YOU DEPLOY: search this file for "your-domain.com"
         and replace it with your real website address (2 places
         per tag below). Also fix the GitHub / LinkedIn links.
         ===================================================== -->

    <!-- ===== Basic SEO ===== -->
    <title>Muhammad Hussain Memon | FullStack MERN &amp; React Developer</title>
    <meta
      name="description"
      content="Muhammad Hussain Memon is a FullStack MERN &amp; React developer for hire. Building fast, accessible web apps with Node.js, Express and MongoDB. See projects."
    />
    <meta
      name="keywords"
      content="Muhammad Hussain Memon, Hussain Memon, Muhammad Hussain Memon developer, Muhammad Hussain Memon portfolio, FullStack developer, MERN stack developer, React developer, React.js developer, Node.js developer, Express.js developer, MongoDB developer, JavaScript developer, Frontend developer, Backend developer, Web developer, Web application developer, Freelance web developer, Freelance FullStack developer, Hire MERN developer, Hire React developer, Material UI developer, REST API development, Responsive web design, Accessible web development, Website development, Developer portfolio"
    />
    <meta name="author" content="Muhammad Hussain Memon" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- ===== Icons and browser colours ===== -->
    <link rel="icon" type="image/png" href="/myProfile.png" />
    <link rel="apple-touch-icon" href="/myProfile.png" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="color-scheme" content="dark light" />

    <!-- ===== Open Graph (link preview on WhatsApp, LinkedIn, Facebook, Slack) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Muhammad Hussain Memon" />
    <meta property="og:title" content="Muhammad Hussain Memon | FullStack MERN &amp; React Developer" />
    <meta
      property="og:description"
      content="I build fast, accessible web apps with React, Node.js, Express and MongoDB. See my projects, skills and certificates."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="https://your-domain.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Muhammad Hussain Memon, FullStack MERN Developer" />
    <meta property="og:locale" content="en_US" />

    <!-- ===== Twitter / X card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Muhammad Hussain Memon | FullStack MERN &amp; React Developer" />
    <meta
      name="twitter:description"
      content="I build fast, accessible web apps with React, Node.js, Express and MongoDB."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />
    <meta name="twitter:image:alt" content="Muhammad Hussain Memon, FullStack MERN Developer" />

    <!-- ===== Structured data (helps Google understand who you are) ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://your-domain.com/#website",
            "url": "https://your-domain.com/",
            "name": "Muhammad Hussain Memon",
            "description": "Portfolio of Muhammad Hussain Memon, a FullStack MERN developer.",
            "inLanguage": "en",
            "publisher": { "@id": "https://your-domain.com/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://your-domain.com/#person",
            "name": "Muhammad Hussain Memon",
            "alternateName": "Hussain Memon",
            "url": "https://your-domain.com/",
            "image": "https://your-domain.com/myProfile.png",
            "jobTitle": "FullStack MERN Developer",
            "description": "FullStack (MERN) developer who builds fast, accessible web applications with React, Node.js, Express and MongoDB.",
            "knowsAbout": [
              "FullStack web development",
              "MERN stack",
              "React",
              "JavaScript",
              "Node.js",
              "Express.js",
              "MongoDB",
              "Material UI",
              "REST APIs",
              "Responsive web design",
              "Web accessibility",
              "Frontend development",
              "Backend development"
            ],
            "sameAs": [
              "https://github.com/your-username",
              "https://linkedin.com/in/your-username"
            ]
          },
          {
            "@type": "ProfilePage",
            "@id": "https://your-domain.com/#profilepage",
            "url": "https://your-domain.com/",
            "name": "Muhammad Hussain Memon | FullStack MERN & React Developer",
            "isPartOf": { "@id": "https://your-domain.com/#website" },
            "about": { "@id": "https://your-domain.com/#person" },
            "mainEntity": { "@id": "https://your-domain.com/#person" }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Shown only if JavaScript is off. Gives crawlers and readers real text. -->
    <noscript>
      <main style="font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; line-height: 1.6">
        <h1>Muhammad Hussain Memon, FullStack MERN &amp; React Developer</h1>
        <p>
          I build fast, accessible web apps with React, Node.js, Express and MongoDB. Please turn on JavaScript to
          see my projects, skills and certificates.
        </p>
      </main>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
